services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vuln}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-vulniq}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://vuln:local-only-change-me@postgres:5432/vulniq}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-local-only-change-me}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret}
      SCAN_DIR: ${SCAN_DIR:-/data/scans}
      TRIVY_TIMEOUT: ${TRIVY_TIMEOUT:-600}
      NMAP_TIMEOUT: ${NMAP_TIMEOUT:-300}
    ports:
      - "8000:8000"
    volumes:
      - scandata:/data
      - trivycache:/root/.cache/trivy
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    depends_on:
      - backend

  juice-shop:
    image: bkimminich/juice-shop
    profiles: ["lab"]
    ports:
      - "3000:3000"

volumes:
  pgdata:
  scandata:
  trivycache:
